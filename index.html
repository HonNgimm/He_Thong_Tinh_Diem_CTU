<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống Tính điểm Tổ Hợp CTU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 20px;
      background: url("nen-ctu.jpg") no-repeat center center fixed;
      background-size: cover;
      box-sizing: border-box;
    }

    .box {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 20px 30px;
      max-width: 550px;
      margin: 80px auto 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      color: #cc0000;
      font-size: 28px;
      margin-top: 0;
      text-transform: uppercase;
    }

    p {
      font-size: 18px;
      color: #333;
    }

    .popup {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to right, #cce6ff, #e6f2ff);
      border-radius: 16px;
      padding: 25px 35px;
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      gap: 15px;
      text-align: left;
    }

    .popup img {
      width: 110px;
      flex-shrink: 0;
    }

    .popup h3 {
      margin: 0 0 8px;
      color: #003366;
      font-size: 21px;
    }

    .popup a {
      display: block;
      margin: 4px 0;
      text-decoration: none;
      color: #0066cc;
      font-weight: bold;
      font-size: 17px;
      word-break: break-word;
    }

    .popup a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .popup {
        flex-direction: column;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .popup img {
        margin-bottom: 10px;
      }

      .popup h3 {
        font-size: 16px;
      }

      .popup a {
        font-size: 15px;
        text-align: center;
      }

      .box {
        padding: 30px 15px;
        margin-top: 60px;
      }

      h2 {
        font-size: 18px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🚧 HỆ THỐNG ĐANG BẢO TRÌ 🚧</h2>
    <p>HỆ THỐNG SẼ ĐƯỢC MỞ LẠI TRƯỚC NGÀY 20/08/2025<br>
  </div>

  <div class="popup">
    <img src="icon.png" alt="capy">
    <div>
      <h3>TỔNG HỢP THÔNG TIN TUYỂN SINH</h3>
      <a href="https://forms.gle/KBHB4GbeVH2u9yFA7" target="_blank">Đăng Ký Ôn Thi Tiếng Anh Đầu Vào MIỄN PHÍ</a>
      <a href="https://zalo.me/g/qkqzox111" target="_blank">Tham Gia Group Zalo Tư Vấn Tuyển Sinh</a>
      <a href="https://docs.google.com/spreadsheets/d/1ycWJZnvW822vo_qjQ1gJDPAjqWKDVsweNUKNYCYBaQM/edit?gid=212231679#gid=212231679" target="_blank">Xem thông tin tổng hợp Q&A Tuyển Sinh CTU</a>
    </div>
  </div>

</body>
</html>
